# OnTime → Next.js (127.0.0.1:3000). Include z C:\nginx\conf\nginx.conf
#
# Po wdrożeniu certyfikatu HTTPS:
#   1. Ustaw ścieżki ssl_certificate / ssl_certificate_key
#   2. Zmień server_name na właściwą domenę
#   3. W .env ustaw NEXT_PUBLIC_APP_URL=https://ontime.mikran.pl
#   4. npm run build + restart serwisu

upstream ontime_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# --- HTTPS (główny) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ontime.mikran.pl;

    ssl_certificate     /etc/ssl/certs/ontime.pem;
    ssl_certificate_key /etc/ssl/private/ontime.key;

    # HSTS — wymusza HTTPS w przeglądarkach na 1 rok
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://ontime_next;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name ontime.mikran.pl;
    return 301 https://$host$request_uri;
}
