name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint (session scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run session ESLint
        run: npm run lint:session

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  security-audit:
    name: Security audits
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit admin mutations
        run: npm run audit:admin-mutations

      - name: Audit service role annotations
        run: npm run audit:service-role

      - name: Audit server action redirect callers
        run: npm run audit:server-action-redirect

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: postgresql://ontime_app:test@127.0.0.1:5432/ontime_test
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars
      STORAGE_ROOT: /tmp/ontime-storage
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret-32charsxx
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3099
      CRON_SECRET: ci-test-secret
      PASSWORD_RESET_OTP_SECRET: ci-password-reset-otp-secret-32c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit, security-audit]
    permissions:
      contents: read
      actions: read
    env:
      CI: true
      E2E_LAB: "1"
      DATABASE_URL: postgresql://ontime_app:test@127.0.0.1:5432/ontime_test
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars
      STORAGE_ROOT: /tmp/ontime-storage
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret-32charsxx
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3099
      CRON_SECRET: ci-test-secret
      PASSWORD_RESET_OTP_SECRET: ci-password-reset-otp-secret-32c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Postgres integration (db:migrate)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontime_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ontime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontime_app -d ontime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontime_app:test@127.0.0.1:5432/ontime_test
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars
      STORAGE_ROOT: /tmp/ontime-storage
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret-32charsxx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify db env
        run: npm run verify:db-env
